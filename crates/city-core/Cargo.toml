[package]
name = "mycity-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[lints]
workspace = true

# sha2 0.10.9 gates its runtime-dispatched ARM SHA2 backend behind this feature.
# Other target architectures retain their existing default backend selection.
[target.'cfg(target_arch = "aarch64")'.dependencies]
sha2 = { workspace = true, features = ["asm"] }
